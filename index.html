<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>casflux</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #1a1a1f;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: 'Courier New', monospace;
  }

  .wrap {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .glow-bg {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 600px;
    height: 600px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(180,150,255,0.15) 0%, rgba(26,26,31,0) 70%);
    pointer-events: none;
  }

  #text {
    width: 320px;
    text-align: left;
    font-size: 64px;
    font-weight: bold;
    color: #d8caff;
    letter-spacing: 4px;
    text-shadow: 0 0 20px rgba(180,150,255,0.6), 0 0 40px rgba(180,150,255,0.3);
  }

  .cursor {
    display: inline-block;
    width: 4px;
    background: #d8caff;
    margin-left: 4px;
    animation: blink 0.8s steps(2) infinite;
    box-shadow: 0 0 10px rgba(180,150,255,0.8);
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  .tagline {
    margin-top: 18px;
    font-size: 16px;
    color: #8a7fa8;
    letter-spacing: 6px;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeIn 1s ease forwards;
    animation-delay: 2.4s;
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  .socials {
    margin-top: 120px;
    display: flex;
    gap: 18px;
    opacity: 0;
    animation: fadeIn 1s ease forwards;
    animation-delay: 2.8s;
  }

  .socials a {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 20px;
    border-radius: 8px;
    background: rgba(180,150,255,0.08);
    border: 1px solid rgba(180,150,255,0.35);
    color: #d8caff;
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 1px;
    transition: all 0.25s ease;
  }

  .socials a:hover {
    background: rgba(180,150,255,0.25);
    box-shadow: 0 0 18px rgba(180,150,255,0.6);
    transform: translateY(-3px);
  }

  .socials svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
    flex-shrink: 0;
  }

  #music-toggle {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: rgba(180,150,255,0.1);
    border: 1px solid rgba(180,150,255,0.4);
    color: #d8caff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.25s ease;
    z-index: 10;
  }

  #music-toggle:hover {
    background: rgba(180,150,255,0.25);
    box-shadow: 0 0 18px rgba(180,150,255,0.6);
  }

  #music-toggle svg {
    width: 22px;
    height: 22px;
    fill: currentColor;
  }

  #yt-player-container {
    position: fixed;
    top: -9999px;
    left: -9999px;
    width: 200px;
    height: 200px;
  }

  #loader {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, #2a1f3d 0%, #100a18 75%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    overflow: hidden;
    transition: opacity 0.6s ease, visibility 0.6s ease;
  }

  #loader.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .spider-bg {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 480px;
    height: 480px;
    transform: translate(-50%, -50%);
    opacity: 0.55;
    filter: drop-shadow(0 0 12px rgba(255,80,200,0.4));
    animation: spiderFloat 4s ease-in-out infinite;
    z-index: 1;
  }

  @keyframes spiderFloat {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -48%) scale(1.03); }
  }

  .nametag {
    position: relative;
    z-index: 2;
    font-family: 'Courier New', monospace;
    text-align: center;
  }

  .nametag .hello {
    font-size: 42px;
    font-weight: bold;
    letter-spacing: 3px;
    color: #ffe8e0;
    text-shadow: 0 0 12px rgba(255,60,90,0.7);
  }

  .nametag .subline {
    margin-top: 6px;
    font-size: 22px;
    color: #ffb3c6;
    letter-spacing: 2px;
  }

  .nametag .subline b {
    color: #ffffff;
  }

  .glitch-active .hello,
  .glitch-active .subline {
    animation: glitchShake 0.35s linear;
  }

  .glitch-active .hello::before,
  .glitch-active .hello::after {
    content: 'HELLO';
    position: absolute;
    left: 0; top: 0; width: 100%;
    animation: glitchShake 0.35s linear;
  }

  .glitch-active .hello::before {
    color: #00e5ff;
    transform: translate(-3px, -2px);
    mix-blend-mode: screen;
  }

  .glitch-active .hello::after {
    color: #ff2d78;
    transform: translate(3px, 2px);
    mix-blend-mode: screen;
  }

  @keyframes glitchShake {
    0% { transform: translate(0,0); }
    20% { transform: translate(-4px, 2px); }
    40% { transform: translate(4px, -2px); }
    60% { transform: translate(-3px, 1px); }
    80% { transform: translate(3px, -1px); }
    100% { transform: translate(0,0); }
  }

  .wtf-text {
    position: absolute;
    bottom: 70px;
    left: 50%;
    transform: translateX(-50%) scale(0.8);
    font-family: 'Courier New', monospace;
    font-size: 20px;
    letter-spacing: 3px;
    color: #ff2d78;
    text-shadow: 0 0 14px rgba(255,45,120,0.9);
    opacity: 0;
    z-index: 2;
  }

  .wtf-text.show {
    animation: wtfPop 0.6s ease forwards;
  }

  @keyframes wtfPop {
    0% { opacity: 0; transform: translateX(-50%) scale(0.6); }
    40% { opacity: 1; transform: translateX(-50%) scale(1.15); }
    70% { transform: translateX(-50%) scale(0.95); }
    100% { opacity: 1; transform: translateX(-50%) scale(1); }
  }
</style>

<script>
const word = "casflux";
const el = document.getElementById('text');
let i = 0;

function type() {
  if (i <= word.length) {
    el.innerHTML = word.slice(0, i) + '<span class="cursor">&nbsp;</span>';
    i++;
    setTimeout(type, 180);
  } else {
    // keep cursor blinking at the end, restart the loop after a pause
    setTimeout(() => {
      i = 0;
      eraseLoop();
    }, 2200);
  }
}

function eraseLoop() {
  let j = word.length;
  function erase() {
    if (j >= 0) {
      el.innerHTML = word.slice(0, j) + '<span class="cursor">&nbsp;</span>';
      j--;
      setTimeout(erase, 90);
    } else {
      setTimeout(() => { i = 0; type(); }, 500);
    }
  }
  erase();
}

type();
</script>

<script>
  // Loader intro sequence: show HELLO nametag, glitch once, show "wtf dude", then fade into the site
  const loaderEl = document.getElementById('loader');
  const nametagEl = document.getElementById('nametag');
  const wtfEl = document.getElementById('wtfText');

  setTimeout(() => {
    nametagEl.classList.add('glitch-active');
    setTimeout(() => nametagEl.classList.remove('glitch-active'), 350);
    wtfEl.classList.add('show');
  }, 1400);

  setTimeout(() => {
    loaderEl.classList.add('hidden');
  }, 3200);
</script>

<script>

  const VIDEO_ID = "hXCIH5VTWyg";
  let ytPlayer;
  let isPlaying = false;
  let playerReady = false;
  let pendingToggle = false;
  let hasStarted = false;

  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.body.appendChild(tag);

  function onYouTubeIframeAPIReady() {
    ytPlayer = new YT.Player('yt-player', {
      height: '200',
      width: '200',
      videoId: VIDEO_ID,
      playerVars: {
        autoplay: 0,
        loop: 1,
        playlist: VIDEO_ID,
        controls: 0
      },
      events: {
        onReady: (e) => {
          playerReady = true;
          if (pendingToggle) {
            pendingToggle = false;
            doToggle();
          }
        }
      }
    });
  }
  window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

  const toggleBtn = document.getElementById('music-toggle');
  const iconOn = document.getElementById('music-icon-on');
  const iconOff = document.getElementById('music-icon-off');

  function doToggle() {
    if (!hasStarted) {
      // very first play must happen directly inside the click handler (user gesture)
      ytPlayer.setVolume(100);
      ytPlayer.unMute();
      ytPlayer.playVideo();
      hasStarted = true;
      isPlaying = true;
      iconOn.style.display = 'none';
      iconOff.style.display = 'block';
      return;
    }
    if (isPlaying) {
      ytPlayer.pauseVideo();
      isPlaying = false;
      iconOn.style.display = 'block';
      iconOff.style.display = 'none';
    } else {
      ytPlayer.playVideo();
      isPlaying = true;
      iconOn.style.display = 'none';
      iconOff.style.display = 'block';
    }
  }

  toggleBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!playerReady || !ytPlayer) {
      pendingToggle = true;
      return;
    }
    doToggle();
  });

  // Start music automatically on the very first tap/click anywhere on the page
  function startOnFirstInteraction() {
    if (hasStarted) return;
    if (!playerReady || !ytPlayer) {
      pendingToggle = true;
      return;
    }
    doToggle();
  }
  document.addEventListener('click', startOnFirstInteraction, { once: true });
  document.addEventListener('touchstart', startOnFirstInteraction, { once: true });
</script>
