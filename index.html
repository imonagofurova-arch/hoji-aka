<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>casflux</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #1a1a1f;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: 'Courier New', monospace;
  }

  .wrap {
    text-align: center;
  }

  .glow-bg {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 600px;
    height: 600px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(180,150,255,0.15) 0%, rgba(26,26,31,0) 70%);
    pointer-events: none;
  }

  #text {
    font-size: 64px;
    font-weight: bold;
    color: #d8caff;
    letter-spacing: 4px;
    text-shadow: 0 0 20px rgba(180,150,255,0.6), 0 0 40px rgba(180,150,255,0.3);
  }

  .cursor {
    display: inline-block;
    width: 4px;
    background: #d8caff;
    margin-left: 4px;
    animation: blink 0.8s steps(2) infinite;
    box-shadow: 0 0 10px rgba(180,150,255,0.8);
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  .tagline {
    margin-top: 18px;
    font-size: 16px;
    color: #8a7fa8;
    letter-spacing: 6px;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeIn 1s ease forwards;
    animation-delay: 2.4s;
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }
</style>
</head>
<body>

<div class="glow-bg"></div>

<div class="wrap">
  <div id="text"></div>
  <div class="tagline">xoji aka</div>
</div>

<script>
const word = "casflux";
const el = document.getElementById('text');
let i = 0;

function type() {
  if (i <= word.length) {
    el.innerHTML = word.slice(0, i) + '<span class="cursor">&nbsp;</span>';
    i++;
    setTimeout(type, 180);
  } else {
    // keep cursor blinking at the end, restart the loop after a pause
    setTimeout(() => {
      i = 0;
      eraseLoop();
    }, 2200);
  }
}

function eraseLoop() {
  let j = word.length;
  function erase() {
    if (j >= 0) {
      el.innerHTML = word.slice(0, j) + '<span class="cursor">&nbsp;</span>';
      j--;
      setTimeout(erase, 90);
    } else {
      setTimeout(() => { i = 0; type(); }, 500);
    }
  }
  erase();
}

type();
</script>

</body>
</html>
